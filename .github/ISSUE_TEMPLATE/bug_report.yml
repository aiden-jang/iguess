name: Bug report
description: Report a game, drawing, connection or layout problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected. Do not include private room links or credentials.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and game mode
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or additional context
