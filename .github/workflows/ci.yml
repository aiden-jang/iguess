name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm exec playwright install --with-deps chromium webkit
      # The e2e stack pins the game-server to an empty AI_WORKER_URL, so a CI run
      # can never reach a paid vision provider. See playwright.config.ts.
      # Chromium and WebKit share one local room stack; serialize to keep sockets isolated.
      - run: pnpm test:e2e --workers=1
      - name: Keep browser and Worker failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            .wrangler/e2e-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: production-assets
          path: packages/client/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Deploy after checks pass. The token needs Workers scope; this app has no D1 migrations.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-iguess
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: production-assets
          path: packages/client/dist/
      - name: Deploy ai-worker
        run: pnpm run deploy
        working-directory: packages/ai-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy game-server and verified client
        working-directory: packages/game-server
        run: pnpm run deploy:assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
