name = "iguess-ai-local"
main = "src/worker.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Local development and browser tests have no Workers AI binding.
[dev]
port = 33400

[vars]
VISION_PROVIDER = "mock"

[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true
