name = "iguess-ai"
main = "src/worker.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Local dev port — the game-server points AI_WORKER_URL here in dev (--var AI_WORKER_URL:http://localhost:33400).
[dev]
port = 33400

# Workers AI uses the bound account and its usage limits.
# It's the default when no paid key (OPENAI_API_KEY / ANTHROPIC_API_KEY) is set.
[ai]
binding = "AI"

# Provider keys are secrets (wrangler secret put OPENAI_API_KEY / ANTHROPIC_API_KEY). With none of
# those, the worker uses Workers AI — or the mock if the [ai] binding is unavailable.
# VISION_PROVIDER can force one ("mock" | "openai" | "anthropic" | "workers").

# Workers Logs — native error/log observability. Tail live with `wrangler tail`;
# browse + query in the dashboard (Workers & Pages → the worker → Logs).
[observability]
enabled = true
head_sampling_rate = 1

[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true
