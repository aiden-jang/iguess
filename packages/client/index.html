    <style>
      :root {
        --bg: #0b0a12;
        --panel: #15131f;
        --panel-2: #1d1a2b;
        --line: #2c2740;
        --text: #f1edf7;
        --muted: #a39bb8;
        --accent: #a855f7;
        --accent-2: #f472b6;
        --grad: linear-gradient(135deg, #a855f7 0%, #f472b6 55%, #fb923c 100%);
        --good: #34d399;
        --bad: #fb7185;

        /* Spring easing, sampled from a damped harmonic oscillator. A cubic-bezier is bounded by
           its endpoints and so cannot overshoot and settle back, however springy the control
           points look; linear() can, because it is a lookup table. 1.1% and 12% overshoot. Both
           are normalized, so duration stays a separate decision. */
        --ease-spring: linear(0, 0.038, 0.13, 0.248, 0.373, 0.494, 0.604, 0.699, 0.778, 0.842, 0.893, 0.931, 0.959, 0.98, 0.993, 1.002, 1.008, 1.01, 1.011, 1.011, 1.01, 1.009, 1.007, 1.006, 1.005, 1.004, 1.003, 1.002, 1);
        --ease-bounce: linear(0, 0.084, 0.277, 0.507, 0.724, 0.899, 1.022, 1.093, 1.122, 1.121, 1.102, 1.074, 1.046, 1.021, 1.003, 0.991, 0.986, 0.984, 0.986, 0.989, 0.993, 0.996, 0.999, 1.001, 1.002, 1.002, 1.002, 1.002, 1);
      }
      h1, h2, h3 { text-wrap: balance; }
      p { text-wrap: pretty; }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      /* Base color on the root canvas so any scroll-overflow area (e.g. the tall home screen,
         whose content exceeds the 100%-height body box) is still covered — otherwise the body
         background stops at the viewport height and leaves a seam/line below it. */
      html { background: var(--bg); }
      body {
        margin: 0;
        font-family: "Inter Variable", "Inter", system-ui, sans-serif;
        background:
          radial-gradient(1100px 560px at 82% -12%, rgba(168,85,247,0.20) 0%, transparent 60%),
          var(--bg);
        /* Glue the gradient to the viewport so it covers the visible area at any scroll position
           instead of ending at the body box. */
        background-attachment: fixed;
        color: var(--text);
      }
      input, button, select { font-family: inherit; }
      /* Visible keyboard focus everywhere (mouse clicks stay clean). */
      :focus-visible {
        outline: 2px solid var(--accent-2);
        outline-offset: 2px;
        border-radius: 8px;
      }
      input:focus-visible { outline-offset: 0; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #322b47; border-radius: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      @keyframes floaty {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(-6deg); }
      }
      @keyframes shimmer {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      @keyframes pop {
        0% { transform: scale(0.96); opacity: 0; }
        60% { transform: scale(1.02); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes glowPulse {
        0%, 100% { box-shadow: 0 6px 18px rgba(168,85,247,0.30); }
        50% { box-shadow: 0 8px 28px rgba(244,114,182,0.55); }
      }
      /* Animated gradient text (title / room name). */
      .grad-anim {
        background: linear-gradient(90deg, #a855f7, #f472b6, #fb923c, #f472b6, #a855f7);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 5s linear infinite;
      }
      /* Frosted glass panel. */
      .glass {
        background: rgba(29, 26, 43, 0.55);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
      }
      /* Hover lift for clickable cards / buttons. */
      .lift { transition: transform .12s ease, box-shadow .12s ease, filter .12s ease; }
      .lift:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
      .lift:active:not(:disabled) { transform: translateY(0) scale(0.98); }
      .pulse-cta { animation: glowPulse 2.4s ease-in-out infinite; }
      .pop-in { animation: pop .42s var(--ease-bounce) both; }
      @keyframes confettiFall {
        0% { transform: translateY(-12vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 1; }
      }
      .confetti-piece {
        position: fixed;
        top: 0;
        font-size: 22px;
        pointer-events: none;
        z-index: 9999;
        will-change: transform;
      }
      @keyframes wiggle {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-18deg); }
        75% { transform: rotate(18deg); }
      }
      .wiggle:hover { animation: wiggle .4s ease-in-out; }
      @keyframes bounceDot {
        0%, 80%, 100% { transform: translateY(0); opacity: .4; }
        40% { transform: translateY(-4px); opacity: 1; }
      }
      .dot { display: inline-block; animation: bounceDot 1.2s infinite both; }
      .dot:nth-child(2) { animation-delay: .15s; }
      .dot:nth-child(3) { animation-delay: .3s; }
      @keyframes toastIn {
        0% { transform: translate(-50%, -16px) scale(.9); opacity: 0; }
        100% { transform: translate(-50%, 0) scale(1); opacity: 1; }
      }
      .toast-in { animation: toastIn .42s var(--ease-spring) both; }

      /* Respect users who don't want motion: kill animations + transitions. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
        .confetti-piece { display: none !important; }
      }

      /* Responsive: stack the 3-column layout on narrow screens and keep the WHOLE game
         inside one viewport — the page itself never scrolls. The canvas flexes to fill
         whatever the (bounded) chat and scoreboard don't use; chat and scoreboard scroll
         internally if their content is taller than their share. */
      @media (max-width: 880px) {
        .app-layout {
          display: flex !important;
          flex-direction: column;
          height: 100dvh !important;
          overflow: hidden;
        }
        .app-layout > * { width: 100%; min-height: 0; }

        /* Canvas pane grows; the board itself fills the pane (banner + toolbar aside). */
        .app-layout .pane-canvas {
          order: 1;
          flex: 1 1 auto !important;
          min-height: 0;
          padding: 10px 12px !important;
          gap: 8px !important;
        }
        .app-layout .canvas-wrap { height: auto !important; min-height: 0; }

        /* Banner: wrap the round-pill / word tiles / timer onto extra lines instead of
           letting them bleed off the right edge. */
        .app-layout .play-banner {
          flex-wrap: wrap !important;
          gap: 8px 10px !important;
          padding: 8px 12px !important;
        }
        .app-layout .word-tiles { flex-wrap: wrap !important; }

        /* Drawing toolbar: compact, wrapping into at most ~2 tidy rows (no cut-off
           horizontal scroll). Neutralize the undo button's marginLeft:auto and shrink
           the brush slider so the row packs efficiently. */
        .app-layout .draw-toolbar {
          gap: 6px !important;
          padding: 8px 10px !important;
        }
        .app-layout .draw-toolbar > button { margin-left: 0 !important; }
        .app-layout .draw-toolbar input[type="range"] { width: 92px !important; }

        /* Chat directly under the canvas so a guesser reaches the input fast. Given a taller share
           (~5-6 visible lines) since 24dvh left barely two lines after the label/reactions/input. */
        .app-layout > main {
          order: 2;
          flex: 0 0 32dvh !important;
          min-height: 0;
          padding: 10px 12px !important;
          gap: 6px !important;
        }

        /* Scoreboard/controls last, compact; scrolls internally rather than clipping. */
        .app-layout > aside {
          order: 3;
          flex: 0 0 auto;
          max-height: 15dvh;
          overflow-y: auto !important;
          padding: 10px 12px !important;
          gap: 8px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
