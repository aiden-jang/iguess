<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>is it a dog? · drawing game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0a12;
        --panel: #15131f;
        --panel-2: #1d1a2b;
        --line: #2c2740;
        --text: #f1edf7;
        --muted: #a39bb8;
        --accent: #a855f7;
        --accent-2: #f472b6;
        --grad: linear-gradient(135deg, #a855f7 0%, #f472b6 55%, #fb923c 100%);
        --good: #34d399;
        --bad: #fb7185;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        background:
          radial-gradient(1100px 560px at 82% -12%, rgba(168,85,247,0.22) 0%, transparent 60%),
          radial-gradient(900px 520px at -12% 112%, rgba(244,114,182,0.18) 0%, transparent 58%),
          radial-gradient(700px 500px at 50% 120%, rgba(251,146,60,0.10) 0%, transparent 60%),
          var(--bg);
        color: var(--text);
      }
      input, button, select { font-family: inherit; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #322b47; border-radius: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      @keyframes floaty {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(-6deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
