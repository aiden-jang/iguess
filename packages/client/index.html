<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>is it a dog? · drawing game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0a12;
        --panel: #15131f;
        --panel-2: #1d1a2b;
        --line: #2c2740;
        --text: #f1edf7;
        --muted: #a39bb8;
        --accent: #a855f7;
        --accent-2: #f472b6;
        --grad: linear-gradient(135deg, #a855f7 0%, #f472b6 55%, #fb923c 100%);
        --good: #34d399;
        --bad: #fb7185;
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        font-family: "Inter", system-ui, sans-serif;
        background:
          radial-gradient(1100px 560px at 82% -12%, rgba(168,85,247,0.22) 0%, transparent 60%),
          radial-gradient(900px 520px at -12% 112%, rgba(244,114,182,0.18) 0%, transparent 58%),
          radial-gradient(700px 500px at 50% 120%, rgba(251,146,60,0.10) 0%, transparent 60%),
          var(--bg);
        color: var(--text);
      }
      input, button, select { font-family: inherit; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: #322b47; border-radius: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      @keyframes floaty {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(-6deg); }
      }
      @keyframes shimmer {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      @keyframes pop {
        0% { transform: scale(0.96); opacity: 0; }
        60% { transform: scale(1.02); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes glowPulse {
        0%, 100% { box-shadow: 0 6px 18px rgba(168,85,247,0.30); }
        50% { box-shadow: 0 8px 28px rgba(244,114,182,0.55); }
      }
      /* Animated gradient text (title / room name). */
      .grad-anim {
        background: linear-gradient(90deg, #a855f7, #f472b6, #fb923c, #f472b6, #a855f7);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 5s linear infinite;
      }
      /* Frosted glass panel. */
      .glass {
        background: rgba(29, 26, 43, 0.55);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
      }
      /* Hover lift for clickable cards / buttons. */
      .lift { transition: transform .12s ease, box-shadow .12s ease, filter .12s ease; }
      .lift:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
      .lift:active:not(:disabled) { transform: translateY(0) scale(0.98); }
      .pulse-cta { animation: glowPulse 2.4s ease-in-out infinite; }
      .pop-in { animation: pop .28s ease-out both; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
