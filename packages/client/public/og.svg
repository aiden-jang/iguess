<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Social share card. Content is CENTERED so consumers that crop the 1.91:1 card toward a
       square (iOS/Safari share-sheet thumbnail) still show the mark + wordmark, not empty space. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8" />
      <stop offset="1" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0b0a12" />

  <!-- mark + wordmark only (no tagline — it turns to specks in a share-sheet thumbnail), centered -->
  <g transform="translate(507, 160)">
    <rect width="186" height="186" rx="50" fill="url(#g)" />
    <g transform="translate(18.6, 18.6) scale(0.290)" fill="#0b0a12">
      <circle cx="256" cy="330" r="78" />
      <circle cx="158" cy="252" r="36" />
      <circle cx="218" cy="200" r="36" />
      <circle cx="294" cy="200" r="36" />
      <circle cx="354" cy="252" r="36" />
    </g>
  </g>

  <text x="600" y="480" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="150" font-weight="800" fill="#f5f3ff" letter-spacing="-4">iguess</text>
</svg>
