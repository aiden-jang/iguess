name = "iguess-game"
main = "src/worker.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
# Served only on the custom domain, not a *.workers.dev route.
workers_dev = false

# Local dev port — matches the client Vite proxy target (packages/client/vite.config.ts).
[dev]
port = 33300

# Set AI_WORKER_URL only during deployment. Keeping it out of vars prevents local play and tests from reaching paid production AI.

# Shared product-events dataset; the app name is recorded in index1 and blob1.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "aidenjang_events"

# Each room owns its sockets and versioned recovery checkpoints in durable storage.
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Native per-IP rate limiting, checked in the Worker before a room DO is created (see worker.ts).
# Caps new-connection spam so one client can't spin up unbounded rooms. period must be 10 or 60.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Serve the SPA and room WebSockets on one origin; other requests fall through to assets.
[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Custom domain provisioned on deployment; ignored by local development.
[[routes]]
pattern = "iguess.aidenjang.com"
custom_domain = true

# Check the AI Worker on a schedule to detect provider failure even when mock fallback keeps it available.
[triggers]
crons = ["*/30 * * * *"]

# Worker logs are available through `wrangler tail` and the Cloudflare dashboard.
[observability]
enabled = true
head_sampling_rate = 1
