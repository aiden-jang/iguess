name = "iguess-game"
main = "src/worker.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
# Served only on the custom domain, not a *.workers.dev route.
workers_dev = false

# Local dev port — matches the client Vite proxy target (packages/client/vite.config.ts).
[dev]
port = 33300

# AI_WORKER_URL is set on the deploy command (see this package's deploy script), NOT here. A
# [vars] entry here also reaches `wrangler dev`, which would point local play and the e2e suite
# at the paid production worker. Unset = AI modes tell the room the AI is unavailable, and
# classic mode is unaffected.

# Product events, written fire-and-forget from the room. One dataset across every app, with the
# app name in index1 and blob1, so a single query can compare them.
[[analytics_engine_datasets]]
binding = "EVENTS"
dataset = "aidenjang_events"

# Each room owns its sockets and versioned recovery checkpoints in durable storage.
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Native per-IP rate limiting, checked in the Worker before a room DO is created (see worker.ts).
# Caps new-connection spam so one client can't spin up unbounded rooms. period must be 10 or 60.
# NB: on Wrangler 3 the rate-limit binding lives under [[unsafe.bindings]] (the top-level
# [[ratelimits]] key is Wrangler 4+); using the form this repo's pinned Wrangler recognizes.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Serve the built client SPA from this same Worker so the UI and /rooms/:id/ws share one origin.
# run_worker_first = true → the Worker routes everything; /health + /rooms/* are handled, the rest
# falls through to ASSETS (real files + index.html fallback for client routes).
[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Custom domain. Provisioned on `wrangler deploy` (two-step: deploy once with this commented so
# the first deployment exists, then uncomment and redeploy to attach it). Ignored by local dev.
[[routes]]
pattern = "iguess.aidenjang.com"
custom_domain = true

# Cross-check the ai-worker on a schedule. Nothing else notices a vision key expiring: the worker
# stays up and quietly answers from the mock, so players get random words and find out mid-game.
[triggers]
crons = ["*/30 * * * *"]

# Workers Logs — native error/log observability. Tail live with `wrangler tail`;
# browse + query in the dashboard (Workers & Pages → the worker → Logs).
[observability]
enabled = true
head_sampling_rate = 1
